<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="content">

        <h1>Choose to win</h1>
        <h3>ROCK PAPER SCISSORS</h3>

        <h3 class="round">Round: 1</h3>

        <div id="result">
            
            <div class="score">
                <div class="player">
                    <p>You</p>
                    <p class="player-score">0</p>
                </div>
                <div class="computer">
                    <p>Computer</p>
                    <p class="computer-score">0</p>
                </div>
            </div>

            <div class="round-result">
                <p>Result...</p>
            </div>

            <div class="winner"></div>

        </div>

    </div>

    <div id="container">

        <button class="btn" value="rock" >Rock</button>
        <button class="btn" value="paper">Paper</button>
        <button class="btn" value="scissors">Scissors</button>

    </div>
    
    <script src="script.js"></script>
</body>
</html>
